<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail sending</title>
    <style>
        .main{width:45%; background-color:aliceblue; margin:auto; border-radius:10px; text-align:center; padding-bottom:30px;}
        .info{font-size:30px; font-weight:bold; color: cornflowerblue; padding:20px 0px;}
        label{font-size:22px;}
        input{height:25px; width:50%; border-radius:7px;}
        textarea{height:25px; width:50%; border-radius:7px; padding-top:12px;}
        .sub-btn{width:18%; height:30px; background-color:green; color:white; font-size:15px; font-weight:bold;}
    </style>
</head>
<body>
    <div class="main">
        <div class="info">Sending mail form</div>
        <form action="mail.php" method="post" name="form" class="form-box">
            <label for="name">Name:</label><br>
            <input type="text" name="name" class="inp" placeholder="Enter your name" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" name="email" class="inp" placeholder="Enter your email" required><br><br>

            <label for="subject">Subject</label><br>
            <input type="text" name="subject" class="inp" placeholder="Enter your subject" required><br><br>

            <label for="msg">Message</label><br>
            <textarea name="msg" class="inp" placeholder="Enter the message" required></textarea><br><br>

            <input type="submit" name="submit" value="Send" class="sub-btn">
        </form>
    </div>
</body>
</html>
